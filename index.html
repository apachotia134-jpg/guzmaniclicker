<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>guzmaniclicker</title>
    <style>
        :root {
            --icon-size: 56px;   /* size of every upgrade icon (width and height) */
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f1f1f1;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;              /* no pull-to-refresh bounce */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;             /* no double-tap zoom, faster taps */
        }

        /* Fills the whole screen */
        .game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #2a2a2a;
            display: flex;
            overflow: hidden;
            box-sizing: border-box;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .left-panel {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: relative; /* lets the corner buttons sit inside this panel */
        }

        /* Small "per click" number in the corner */
        .per-click {
            position: absolute;
            top: 14px;
            left: 16px;
            font-size: 14px;
            color: #a0dce4;
            opacity: 0.9;
        }

        /* Settings button in the opposite corner */
        .settings-btn {
            position: absolute;
            top: 10px;
            right: 14px;
            background: transparent;
            border: 1px solid #666;
            color: #ddd;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .settings-btn:hover {
            background-color: #3a3a3a;
            border-color: #999;
        }

        .jesuslings-title {
            font-size: 2.6rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .jesuslings-number {
            font-size: 3.6rem;
            margin: 0 0 20px 0;
            color: #a0dce4;
            font-weight: bold;
            cursor: pointer;      /* click to switch number format */
            user-select: none;
            -webkit-user-select: none;
        }

        .jesuslings-number:hover {
            filter: brightness(1.2);
        }

        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            outline: none;
            transition: transform 0.1s;
            background: transparent;
        }

        /* Image grows with the window height */
        .clicker-img {
            max-width: min(360px, 42vh);
            max-height: min(360px, 42vh);
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
            -webkit-user-drag: none;
            user-select: none;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15);
        }

        .image-clicker-container:active {
            transform: scale(0.92);
        }

        /* MIDDLE: upgrades column */
        .upgrades-panel {
            width: 340px;
            flex-shrink: 0;
            background-color: #222;
            border-left: 1px solid #444;
            padding: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Each section is its own box */
        .upgrade-box {
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            padding: 10px;
        }

        .upgrade-box-title {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .upgrade-box-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-btn {
            width: 100%;
            min-height: 64px;
            padding: 10px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s;
            font-family: inherit;
            -webkit-user-select: none;
            user-select: none;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #218838;
        }

        .upgrade-btn:disabled {
            background-color: #444;
            color: #999;
            cursor: not-allowed;
        }

        /* Every icon is locked to the same square, whatever the image size.
           "cover" fills the whole square and crops any extra from the edges.
           Change cover to contain if you'd rather see the whole image with gaps. */
        .upgrade-icon {
            display: block;
            width: var(--icon-size);
            height: var(--icon-size);
            min-width: var(--icon-size);
            min-height: var(--icon-size);
            max-width: var(--icon-size);
            max-height: var(--icon-size);
            flex: 0 0 var(--icon-size);
            object-fit: cover;
            object-position: center;
            border-radius: 6px;
            background: rgba(0,0,0,0.25);
            -webkit-user-drag: none;
        }

        .upgrade-btn:disabled .upgrade-icon {
            filter: grayscale(1);
            opacity: 0.6;
        }

        .upgrade-text {
            display: block;
        }

        .upgrade-name {
            display: block;
            font-size: 15px;
            font-weight: bold;
        }

        .upgrade-info {
            display: block;
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
        }

        /* RIGHT: description box */
        .description-panel {
            width: 300px;
            flex-shrink: 0;
            background-color: #222;
            border-left: 1px solid #444;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .description-box {
            flex: 1;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            padding: 14px;
            overflow-y: auto;
        }

        .description-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .description-text {
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
            white-space: pre-wrap;
        }

        /* ---------- POP-UP WINDOWS (settings, save, admin) ---------- */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 2000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(480px, 100%);
            max-height: 90vh;
            max-height: 90dvh;
            overflow-y: auto;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 18px;
            box-sizing: border-box;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 0 0 8px 0;
        }

        .modal-help {
            font-size: 13px;
            color: #bbb;
            line-height: 1.4;
            margin: 0 0 12px 0;
        }

        .modal textarea {
            width: 100%;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }

        .modal-input {
            width: 100%;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px;
            font-family: inherit;
            font-size: 15px;
        }

        .modal-input:focus,
        .modal textarea:focus {
            outline: none;
            border-color: #28a745;
        }

        .modal-status {
            min-height: 18px;
            margin: 8px 0 4px 0;
            font-size: 13px;
        }

        .modal-status.ok  { color: #7CFC9A; }
        .modal-status.err { color: #ff6b6b; }

        .modal-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .modal-buttons button {
            flex: 1 1 auto;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .modal-buttons button:hover {
            background: #218838;
        }

        .modal-buttons button.secondary {
            background: #444;
        }

        .modal-buttons button.secondary:hover {
            background: #555;
        }

        /* Settings window list */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 14px 0;
        }

        .settings-item {
            width: 100%;
            padding: 14px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #333;
            color: #eee;
            font-size: 15px;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .settings-item:hover {
            background: #404040;
        }

        .settings-item.danger {
            border-color: #7b2630;
            color: #ff8d8d;
        }

        .settings-item.danger:hover {
            background: #3d2428;
        }

        .settings-item-note {
            display: block;
            margin-top: 3px;
            font-size: 12px;
            color: #999;
        }

        /* Admin panel sections */
        .admin-section {
            border: 1px solid #444;
            border-radius: 8px;
            background: #252525;
            padding: 12px;
            margin-bottom: 12px;
        }

        .admin-section-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin: 0 0 10px 0;
            color: #a0dce4;
        }

        .admin-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .admin-row:last-child {
            margin-bottom: 0;
        }

        .admin-label {
            flex: 1 1 120px;
            font-size: 14px;
        }

        .admin-row .modal-input {
            flex: 1 1 100px;
            width: auto;
            min-width: 0;
        }

        .admin-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }

        .admin-btn:hover {
            background: #218838;
        }

        .admin-btn.secondary {
            background: #444;
        }

        .admin-btn.secondary:hover {
            background: #555;
        }

        /* ---------- ANGRY JESUS EVENT ---------- */

        /* Crosses the whole screen from left to right */
        .angry-jesus {
            position: fixed;
            left: -170px;
            width: 140px;
            height: 140px;
            z-index: 1000;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            animation-name: angry-cross;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes angry-cross {
            from { left: -170px; }
            to   { left: 100vw; }
        }

        .angry-jesus img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8));
            animation: angry-wobble 0.5s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes angry-wobble {
            from { transform: rotate(-8deg) translateY(-6px); }
            to   { transform: rotate(8deg) translateY(6px); }
        }

        /* Floating "+N" / "-N" text */
        .float-text {
            position: fixed;
            z-index: 1001;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            animation: float-up 1.6s ease-out forwards;
        }

        .float-text.gain { color: #7CFC9A; }
        .float-text.loss { color: #ff5a5a; }

        @keyframes float-up {
            from { opacity: 1; transform: translateY(0); }
            to   { opacity: 0; transform: translateY(-80px); }
        }

        /* ================= RESPONSIVE ================= */

        /* Small laptops and landscape phones: keep 3 columns but slimmer */
        @media (max-width: 1000px) and (min-width: 801px) {
            .upgrades-panel { width: 280px; }
            .description-panel { width: 220px; }
        }

        /* Phones in landscape (short screens): shrink the clicker so it fits */
        @media (max-height: 520px) and (min-width: 801px) {
            .jesuslings-title { font-size: 1.8rem; }
            .jesuslings-number { font-size: 2.4rem; margin-bottom: 8px; }
            .clicker-img {
                max-width: min(360px, 48vh);
                max-height: min(360px, 48vh);
            }
        }

        /* Phones in portrait: stack everything in one column */
        @media (max-width: 800px) {
            :root { --icon-size: 48px; }

            .game-container {
                flex-direction: column;
            }

            /* top: clicking area */
            .left-panel {
                order: 1;
                flex: 1 1 0;
                padding: 8px 12px;
            }

            .per-click {
                top: 10px;
                left: 12px;
                font-size: 13px;
            }

            .settings-btn {
                top: 6px;
                right: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }

            .jesuslings-title { font-size: 1.7rem; margin-bottom: 2px; }
            .jesuslings-number { font-size: 2.4rem; margin-bottom: 8px; }

            .clicker-img {
                max-width: min(240px, 28vh);
                max-height: min(240px, 28vh);
            }

            /* middle: description strip */
            .description-panel {
                order: 2;
                width: 100%;
                height: 86px;
                flex: 0 0 auto;
                border-left: none;
                border-top: 1px solid #444;
                padding: 8px 12px;
                box-sizing: border-box;
            }

            .description-box {
                padding: 8px 12px;
            }

            .description-title {
                font-size: 0.95rem;
                margin: 0 0 4px 0;
                padding-bottom: 4px;
            }

            .description-text {
                font-size: 13px;
                line-height: 1.35;
            }

            /* bottom: upgrades list */
            .upgrades-panel {
                order: 3;
                width: 100%;
                height: 42%;
                flex: 0 0 auto;
                border-left: none;
                border-top: 1px solid #444;
                padding: 10px;
                box-sizing: border-box;
                gap: 10px;
            }

            .angry-jesus {
                width: 110px;
                height: 110px;
            }

            .float-text { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="left-panel">
            <div class="per-click" id="per-click">+1 per click</div>
            <button class="settings-btn" id="settings-btn">&#9881; Settings</button>

            <div class="jesuslings-title">jesuslings</div>
            <div class="jesuslings-number" id="jesuslings" title="Click to switch number format">0</div>

            <div id="click-target" class="image-clicker-container">
                <img src="ppzeus.png" alt="Click Target" class="clicker-img" draggable="false">
            </div>
        </div>

        <div class="upgrades-panel">

            <!-- Click upgrades box (top) -->
            <div class="upgrade-box">
                <div class="upgrade-box-title">Click Upgrades</div>
                <div class="upgrade-box-list" id="click-upgrades"></div>
            </div>

            <!-- Other upgrades box (below) -->
            <div class="upgrade-box">
                <div class="upgrade-box-title">Other Upgrades</div>
                <div class="upgrade-box-list" id="other-upgrades"></div>
            </div>

            <!-- Event upgrades box (bottom) -->
            <div class="upgrade-box">
                <div class="upgrade-box-title">Event Upgrades</div>
                <div class="upgrade-box-list" id="event-upgrades"></div>
            </div>

        </div>

        <!-- Description box (right of the upgrades on desktop, a strip under the clicker on phones) -->
        <div class="description-panel">
            <div class="description-box">
                <div class="description-title" id="description-title">Description</div>
                <div class="description-text" id="description-text"></div>
            </div>
        </div>
    </div>

    <!-- Settings window -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-title">Settings</div>
            <div class="settings-list">
                <button class="settings-item" id="set-export">
                    Export save
                    <span class="settings-item-note">Get a code or file of your progress</span>
                </button>
                <button class="settings-item" id="set-import">
                    Import save
                    <span class="settings-item-note">Load progress from a code or file</span>
                </button>
                <button class="settings-item" id="set-admin">
                    Admin panel
                    <span class="settings-item-note">Password protected</span>
                </button>
                <button class="settings-item danger" id="set-reset">
                    Reset game data
                    <span class="settings-item-note">Erase all progress (you will be asked to confirm)</span>
                </button>
            </div>
            <div class="modal-buttons">
                <button id="settings-close" class="secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Export / Import window -->
    <div class="modal-overlay" id="save-modal">
        <div class="modal">
            <div class="modal-title" id="modal-title"></div>
            <div class="modal-help" id="modal-help"></div>
            <textarea id="save-text" rows="6" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
            <div class="modal-status" id="modal-status"></div>
            <div class="modal-buttons">
                <button id="btn-copy">Copy</button>
                <button id="btn-download" class="secondary">Download file</button>
                <button id="btn-file" class="secondary">Load from file</button>
                <button id="btn-import">Import</button>
                <button id="btn-close" class="secondary">Close</button>
            </div>
            <input type="file" id="file-input" accept=".txt,.json,text/plain" hidden>
        </div>
    </div>

    <!-- Admin password window -->
    <div class="modal-overlay" id="admin-login-modal">
        <div class="modal">
            <div class="modal-title">Admin Panel</div>
            <div class="modal-help">Enter the password to continue.</div>
            <input type="password" class="modal-input" id="admin-pass" placeholder="Password"
                   autocomplete="off" autocapitalize="off" spellcheck="false">
            <div class="modal-status" id="admin-login-status"></div>
            <div class="modal-buttons">
                <button id="admin-login-btn">Unlock</button>
                <button id="admin-login-cancel" class="secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Admin panel window -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal">
            <div class="modal-title">Admin Panel</div>
            <div class="modal-help">Short forms work: 5k, 2.5m, 3b, 1t.</div>

            <div class="admin-section">
                <div class="admin-section-title">Jesuslings</div>
                <div class="admin-row">
                    <input type="text" class="modal-input" id="admin-amount" placeholder="Amount (e.g. 1m)"
                           inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false">
                    <button class="admin-btn" id="admin-add">Add</button>
                    <button class="admin-btn secondary" id="admin-set">Set</button>
                </div>
                <div class="admin-row">
                    <button class="admin-btn secondary" data-quick="1000">+1K</button>
                    <button class="admin-btn secondary" data-quick="1000000">+1M</button>
                    <button class="admin-btn secondary" data-quick="1000000000">+1B</button>
                </div>
            </div>

            <div class="admin-section">
                <div class="admin-section-title">Upgrade levels</div>
                <div id="admin-upgrades"></div>
            </div>

            <div class="admin-section">
                <div class="admin-section-title">Events</div>
                <div class="admin-row">
                    <button class="admin-btn" id="admin-spawn-angry">Spawn Angry Jesus now</button>
                </div>
            </div>

            <div class="modal-status" id="admin-status"></div>
            <div class="modal-buttons">
                <button id="admin-lock" class="secondary">Lock &amp; close</button>
            </div>
        </div>
    </div>

    <script>
        // --- PLACEHOLDER ICON (shown when your image file isn't found) ---
        const FALLBACK_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
            '<rect width="64" height="64" rx="8" fill="#555"/>' +
            '<text x="32" y="42" font-size="30" text-anchor="middle" fill="#ddd" font-family="Arial">?</text>' +
            '</svg>'
        );

        // Placeholder for the Angry Jesus himself (red face)
        const ANGRY_FALLBACK = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">' +
            '<circle cx="70" cy="70" r="64" fill="#c0392b" stroke="#7b1e14" stroke-width="6"/>' +
            '<path d="M32 46 L58 58 M108 46 L82 58" stroke="#fff" stroke-width="8" stroke-linecap="round"/>' +
            '<circle cx="48" cy="68" r="8" fill="#fff"/><circle cx="92" cy="68" r="8" fill="#fff"/>' +
            '<path d="M46 108 Q70 88 94 108" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>' +
            '</svg>'
        );

        function useFallbackIcon(img) {
            img.onerror = null; // prevent an endless error loop
            img.src = FALLBACK_ICON;
        }

        // --- NUMBER FORMATTING ---
        // Click the big jesuslings number to switch between short and full
        let showFullNumbers = localStorage.getItem('clicker_fullnumbers') === 'true';

        // Biggest first. Add more tiers here if you want them.
        const NUMBER_TIERS = [
            { value: 1e15, suffix: 'quad' },
            { value: 1e12, suffix: 'trill' },
            { value: 1e9,  suffix: 'bill' },
            { value: 1e6,  suffix: 'mill' }
        ];

        function formatNumber(n) {
            n = Math.floor(n);
            if (showFullNumbers || n < 1e6) {
                return n.toLocaleString();
            }
            for (const tier of NUMBER_TIERS) {
                if (n >= tier.value) {
                    // round down to 1 decimal so it never overstates (5.29 -> 5.2)
                    const short = (Math.floor(n / tier.value * 10) / 10).toFixed(1).replace(/\.0$/, '');
                    return `${short} ${tier.suffix}`;
                }
            }
            return n.toLocaleString();
        }

        // --- ANGRY JESUS SETTINGS ---
        const ANGRY_IMG = 'innocentanger.png';   // <- replace with your own image
        const EVENT_MIN_MS = 45000;           // earliest he can appear after the last one
        const EVENT_MAX_MS = 90000;           // latest he can appear
        const CROSS_TIME_SEC = 6;             // how long he takes to cross the screen
        const PENALTY_PERCENT = 0.10;         // 10% lost if you miss him
        const REWARD_PER_LEVEL = 20;          // x click value paid per level (level 0 still pays 1 level)

        // --- ADMIN SETTINGS ---
        const ADMIN_PASSWORD = 'JAGM';        // <- change the password here
        const MAX_JESUSLINGS = 1e15;          // admin tools can't go above this
        const MAX_COST = 1e15;                // upgrade costs are capped here

        // --- DESCRIPTION BOX TEXT ---
        // Shown when you aren't hovering over an upgrade
        const DEFAULT_DESCRIPTION = "the squishiest descriptions. me dropping 325 roses ima take myself to court.";

        // --- UPGRADE LIST ---
        // section: 'click' = top box, 'other' = middle box, 'event' = bottom box
        // growth: how much the cost multiplies after each purchase
        // description: the text shown in the description box on hover / tap
        const UPGRADES = [
            {
                id: 'power', section: 'click',
                name: 'jesus impact', img: 'powerman.png',
                levelLabel: 'Level', desc: '+1 per click',
                description: 'clickity click the biggest squish',
                baseCost: 50, growth: 2, startLevel: 1,
                levelKey: 'clicker_power', costKey: 'clicker_power_cost'
            },
            {
                id: 'blessing', section: 'click',
                name: 'jesus blessing', img: 'atruesaint.png',
                levelLabel: 'Level', desc: 'x2 click value',
                description: 'let jesus gods bless you (not literal jesus crist) ',
                baseCost: 500, growth: 3, startLevel: 0,
                levelKey: 'clicker_blessing', costKey: 'clicker_blessing_cost'
            },
            {
                id: 'auto', section: 'other',
                name: 'jesus slaves', img: 'jesusslaves.png',
                levelLabel: 'Owned', desc: '+1 per second each',
                description: 'straight from mexico',
                baseCost: 10, growth: 1.5, startLevel: 0,
                levelKey: 'clicker_autos', costKey: 'clicker_cost'
            },
            {
                id: 'angryloot', section: 'event',
                name: 'angry loot', img: 'innocentanger.png',
                levelLabel: 'Level', desc: 'more jesuslings from angry jesus',
                description: 'Description coming soon...',
                baseCost: 200, growth: 2, startLevel: 0,
                levelKey: 'clicker_angryloot', costKey: 'clicker_angryloot_cost'
            }
        ];

        const SECTION_CONTAINERS = {
            click: 'click-upgrades',
            other: 'other-upgrades',
            event: 'event-upgrades'
        };

        // --- GAME STATE ---
        let jesuslings = parseInt(localStorage.getItem('clicker_jesuslings')) || 0;

        UPGRADES.forEach(u => {
            const savedLevel = localStorage.getItem(u.levelKey);
            const savedCost = localStorage.getItem(u.costKey);
            u.level = savedLevel !== null ? parseInt(savedLevel) : u.startLevel;
            u.cost = savedCost !== null ? parseInt(savedCost) : u.baseCost;
        });

        function getUpgrade(id) {
            return UPGRADES.find(u => u.id === id);
        }

        // Jesuslings gained per click
        function clickValue() {
            return getUpgrade('power').level * Math.pow(2, getUpgrade('blessing').level);
        }

        // Jesuslings gained per second
        function perSecond() {
            return getUpgrade('auto').level;
        }

        // Jesuslings you get for popping Angry Jesus
        function angryReward() {
            return clickValue() * REWARD_PER_LEVEL * (1 + getUpgrade('angryloot').level);
        }

        // --- DOM ELEMENTS ---
        const clickTarget = document.getElementById('click-target');
        const jesuslingsDisplay = document.getElementById('jesuslings');
        const perClickDisplay = document.getElementById('per-click');
        const descTitle = document.getElementById('description-title');
        const descText = document.getElementById('description-text');

        function showDescription(u) {
            if (u) {
                descTitle.innerText = u.name;
                descText.innerText = u.description;
            } else {
                descTitle.innerText = 'Description';
                descText.innerText = DEFAULT_DESCRIPTION;
            }
        }

        showDescription(null);

        // Toggle short / full numbers
        jesuslingsDisplay.addEventListener('click', () => {
            showFullNumbers = !showFullNumbers;
            localStorage.setItem('clicker_fullnumbers', showFullNumbers);
            updateDisplay();
        });

        // --- BUILD THE UPGRADE BUTTONS ---
        UPGRADES.forEach(u => {
            // Wrapper so hover works even when the button is disabled
            const item = document.createElement('div');

            const btn = document.createElement('button');
            btn.className = 'upgrade-btn';
            btn.disabled = true;

            const img = document.createElement('img');
            img.className = 'upgrade-icon';
            img.alt = '';
            img.draggable = false;
            img.onerror = () => useFallbackIcon(img);
            img.src = u.img;

            const text = document.createElement('span');
            text.className = 'upgrade-text';

            u.nameEl = document.createElement('span');
            u.nameEl.className = 'upgrade-name';
            u.infoEl = document.createElement('span');
            u.infoEl.className = 'upgrade-info';

            text.appendChild(u.nameEl);
            text.appendChild(u.infoEl);
            btn.appendChild(img);
            btn.appendChild(text);

            btn.addEventListener('click', () => buyUpgrade(u));

            // Mouse: show on hover, clear on leave.
            // Touch/pen: show on tap and keep it showing (there is no hover on phones).
            item.addEventListener('pointerenter', (e) => {
                if (e.pointerType === 'mouse') showDescription(u);
            });
            item.addEventListener('pointerleave', (e) => {
                if (e.pointerType === 'mouse') showDescription(null);
            });
            item.addEventListener('pointerdown', (e) => {
                if (e.pointerType !== 'mouse') showDescription(u);
            });

            u.btn = btn;

            item.appendChild(btn);
            document.getElementById(SECTION_CONTAINERS[u.section]).appendChild(item);
        });

        updateDisplay();

        // --- CORE LOGIC ---

        clickTarget.addEventListener('click', () => {
            jesuslings += clickValue();
            saveGame();
            updateDisplay();
        });

        function buyUpgrade(u) {
            if (jesuslings >= u.cost) {
                jesuslings -= u.cost;
                u.level++;
                u.cost = Math.round(u.cost * u.growth);
                saveGame();
                updateDisplay();
            }
        }

        function updateDisplay() {
            jesuslingsDisplay.innerText = formatNumber(jesuslings);
            perClickDisplay.innerText = `+${formatNumber(clickValue())} per click`;

            UPGRADES.forEach(u => {
                u.nameEl.innerText = `${u.name} (${u.levelLabel}: ${formatNumber(u.level)})`;
                u.infoEl.innerText = `${u.desc} | Cost: ${formatNumber(u.cost)}`;
                u.btn.disabled = jesuslings < u.cost;
            });
        }

        function saveGame() {
            localStorage.setItem('clicker_jesuslings', jesuslings);
            UPGRADES.forEach(u => {
                localStorage.setItem(u.levelKey, u.level);
                localStorage.setItem(u.costKey, u.cost);
            });
        }

        function resetGame() {
            if (confirm("Are you sure you want to reset your jesuslings?")) {
                localStorage.clear();
                jesuslings = 0;
                UPGRADES.forEach(u => {
                    u.level = u.startLevel;
                    u.cost = u.baseCost;
                });
                // keep the player's number-format choice after a reset
                localStorage.setItem('clicker_fullnumbers', showFullNumbers);
                updateDisplay();
            }
        }

        // --- EXPORT / IMPORT ---

        const SAVE_PREFIX = 'JESUS1:';

        // Turns the current game into a single line of text
        function buildSaveCode() {
            const data = {
                jesuslings: Math.floor(jesuslings),
                fullNumbers: showFullNumbers,
                upgrades: {}
            };
            UPGRADES.forEach(u => {
                data.upgrades[u.id] = { level: u.level, cost: u.cost };
            });
            return SAVE_PREFIX + btoa(JSON.stringify(data));
        }

        // Checks a number is safe to load (whole, not negative, not huge)
        function validCount(n) {
            return typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= 1e18 && Math.floor(n) === n;
        }

        // Reads a save code. Returns the data, or null if it isn't a good save.
        function parseSaveCode(raw) {
            try {
                const code = String(raw).replace(/\s+/g, '');
                if (!code.startsWith(SAVE_PREFIX)) return null;
                const data = JSON.parse(atob(code.slice(SAVE_PREFIX.length)));
                if (!data || typeof data !== 'object') return null;
                if (!validCount(data.jesuslings)) return null;
                if (!data.upgrades || typeof data.upgrades !== 'object') return null;
                for (const u of UPGRADES) {
                    const saved = data.upgrades[u.id];
                    if (!saved) continue; // missing upgrades fall back to their defaults
                    if (!validCount(saved.level) || !validCount(saved.cost)) return null;
                }
                return data;
            } catch (err) {
                return null;
            }
        }

        // Replaces the current game with the loaded one
        function applySave(data) {
            jesuslings = data.jesuslings;
            showFullNumbers = data.fullNumbers === true;
            localStorage.setItem('clicker_fullnumbers', showFullNumbers);
            UPGRADES.forEach(u => {
                const saved = data.upgrades[u.id];
                u.level = saved ? saved.level : u.startLevel;
                u.cost = saved ? saved.cost : u.baseCost;
            });
            saveGame();
            updateDisplay();
        }

        // --- SETTINGS WINDOW ---
        const settingsModal = document.getElementById('settings-modal');

        function openSettings() {
            settingsModal.classList.add('open');
        }

        function closeSettings() {
            settingsModal.classList.remove('open');
        }

        document.getElementById('settings-btn').addEventListener('click', openSettings);
        document.getElementById('settings-close').addEventListener('click', closeSettings);

        // Click the dark area outside the window to close it
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettings();
        });

        // Settings choices: close this window, then do the thing
        document.getElementById('set-export').addEventListener('click', () => {
            closeSettings();
            openModal('export');
        });
        document.getElementById('set-import').addEventListener('click', () => {
            closeSettings();
            openModal('import');
        });
        document.getElementById('set-admin').addEventListener('click', () => {
            closeSettings();
            openAdmin();
        });
        document.getElementById('set-reset').addEventListener('click', () => {
            closeSettings();
            resetGame(); // asks "are you sure?" first
        });

        // --- EXPORT / IMPORT WINDOW ---
        const modal = document.getElementById('save-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalHelp = document.getElementById('modal-help');
        const saveText = document.getElementById('save-text');
        const modalStatus = document.getElementById('modal-status');
        const btnCopy = document.getElementById('btn-copy');
        const btnDownload = document.getElementById('btn-download');
        const btnFile = document.getElementById('btn-file');
        const btnImport = document.getElementById('btn-import');
        const btnClose = document.getElementById('btn-close');
        const fileInput = document.getElementById('file-input');

        function setStatus(message, kind) {
            modalStatus.innerText = message || '';
            modalStatus.className = 'modal-status' + (kind ? ` ${kind}` : '');
        }

        function openModal(mode) {
            const exporting = mode === 'export';
            setStatus('');
            modalTitle.innerText = exporting ? 'Export Save' : 'Import Save';
            modalHelp.innerText = exporting
                ? 'Copy this code or download it as a file. Keep it somewhere safe, then use Import to load it on any device.'
                : 'Paste a save code below, or load a saved file, then press Import. This replaces your current progress.';

            saveText.readOnly = exporting;
            saveText.value = exporting ? buildSaveCode() : '';
            saveText.placeholder = exporting ? '' : 'Paste your save code here';

            btnCopy.style.display = exporting ? '' : 'none';
            btnDownload.style.display = exporting ? '' : 'none';
            btnFile.style.display = exporting ? 'none' : '';
            btnImport.style.display = exporting ? 'none' : '';

            modal.classList.add('open');
            if (exporting) {
                saveText.focus();
                saveText.select();
            } else {
                saveText.focus();
            }
        }

        function closeModal() {
            modal.classList.remove('open');
            saveText.value = '';
            setStatus('');
        }

        btnClose.addEventListener('click', closeModal);

        // Click the dark area outside the window to close it
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Copy the export code
        btnCopy.addEventListener('click', async () => {
            const code = saveText.value;
            try {
                await navigator.clipboard.writeText(code);
                setStatus('Copied!', 'ok');
            } catch (err) {
                // older browsers / local files: fall back to selecting the text
                saveText.focus();
                saveText.select();
                try {
                    document.execCommand('copy');
                    setStatus('Copied!', 'ok');
                } catch (err2) {
                    setStatus('Could not copy automatically. Select the text and copy it.', 'err');
                }
            }
        });

        // Download the export code as a file
        btnDownload.addEventListener('click', () => {
            const blob = new Blob([saveText.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'guzmaniclicker-save.txt';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            setStatus('Save file downloaded.', 'ok');
        });

        // Load a save code from a file into the box
        btnFile.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                saveText.value = String(reader.result).trim();
                setStatus('File loaded. Press Import to use it.', 'ok');
            };
            reader.onerror = () => setStatus('Could not read that file.', 'err');
            reader.readAsText(file);
            fileInput.value = ''; // lets you pick the same file again later
        });

        // Import the pasted / loaded code
        btnImport.addEventListener('click', () => {
            const data = parseSaveCode(saveText.value);
            if (!data) {
                setStatus('That is not a valid save code.', 'err');
                return;
            }
            if (!confirm('This will replace your current progress. Continue?')) return;
            applySave(data);
            setStatus('Save imported!', 'ok');
        });

        // --- ADMIN PANEL ---
        // Note: the password is stored in this file, so this keeps casual players
        // out but is not real security. Anyone who views the page source can read it.

        let adminUnlocked = false;   // stays unlocked until you press "Lock & close" or reload

        const adminLoginModal = document.getElementById('admin-login-modal');
        const adminPass = document.getElementById('admin-pass');
        const adminLoginStatus = document.getElementById('admin-login-status');
        const adminModal = document.getElementById('admin-modal');
        const adminAmount = document.getElementById('admin-amount');
        const adminStatus = document.getElementById('admin-status');
        const adminUpgradesBox = document.getElementById('admin-upgrades');

        function setAdminStatus(message, kind) {
            adminStatus.innerText = message || '';
            adminStatus.className = 'modal-status' + (kind ? ` ${kind}` : '');
        }

        // Turns "5k", "2.5m", "3b", "1t" or "1500" into a whole number (or null if invalid)
        function parseAmount(text) {
            const match = String(text).trim().replace(/,/g, '').match(/^(\d+(?:\.\d+)?)([kmbt])?$/i);
            if (!match) return null;
            const multipliers = { k: 1e3, m: 1e6, b: 1e9, t: 1e12 };
            const suffix = match[2] ? match[2].toLowerCase() : '';
            const value = Math.floor(parseFloat(match[1]) * (multipliers[suffix] || 1));
            return Number.isFinite(value) ? value : null;
        }

        // The highest level the admin tools will set (keeps numbers from breaking)
        function adminMaxLevel(u) {
            return u.id === 'blessing' ? 30 : 1000;
        }

        // Works out what an upgrade should cost at a given level
        function costForLevel(u, level) {
            let cost = u.baseCost;
            for (let i = u.startLevel; i < level; i++) {
                cost = Math.round(cost * u.growth);
                if (cost >= MAX_COST) return MAX_COST;
            }
            return cost;
        }

        function refreshAdminInputs() {
            UPGRADES.forEach(u => {
                if (u.adminInput) u.adminInput.value = u.level;
            });
        }

        // Build one row per upgrade (label, level box, Set button)
        UPGRADES.forEach(u => {
            const row = document.createElement('div');
            row.className = 'admin-row';

            const label = document.createElement('div');
            label.className = 'admin-label';
            label.innerText = u.name;

            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'modal-input';
            input.min = u.startLevel;
            input.max = adminMaxLevel(u);
            input.step = 1;
            input.inputMode = 'numeric';
            u.adminInput = input;

            const setBtn = document.createElement('button');
            setBtn.className = 'admin-btn';
            setBtn.innerText = 'Set';
            setBtn.addEventListener('click', () => {
                const level = parseInt(input.value, 10);
                const max = adminMaxLevel(u);
                if (!Number.isInteger(level) || level < u.startLevel || level > max) {
                    setAdminStatus(`${u.name}: enter a level from ${u.startLevel} to ${max}.`, 'err');
                    return;
                }
                u.level = level;
                u.cost = costForLevel(u, level);
                saveGame();
                updateDisplay();
                refreshAdminInputs();
                setAdminStatus(`${u.name} set to level ${level}.`, 'ok');
            });

            row.appendChild(label);
            row.appendChild(input);
            row.appendChild(setBtn);
            adminUpgradesBox.appendChild(row);
        });

        function openAdmin() {
            if (adminUnlocked) {
                showAdminPanel();
            } else {
                adminPass.value = '';
                adminLoginStatus.innerText = '';
                adminLoginStatus.className = 'modal-status';
                adminLoginModal.classList.add('open');
                adminPass.focus();
            }
        }

        function closeAdminLogin() {
            adminLoginModal.classList.remove('open');
            adminPass.value = '';
        }

        function showAdminPanel() {
            setAdminStatus('');
            adminAmount.value = '';
            refreshAdminInputs();
            adminModal.classList.add('open');
        }

        function closeAdminPanel() {
            adminModal.classList.remove('open');
        }

        function tryAdminLogin() {
            if (adminPass.value === ADMIN_PASSWORD) {
                adminUnlocked = true;
                closeAdminLogin();
                showAdminPanel();
            } else {
                adminLoginStatus.innerText = 'Wrong password.';
                adminLoginStatus.className = 'modal-status err';
                adminPass.select();
            }
        }

        document.getElementById('admin-login-btn').addEventListener('click', tryAdminLogin);
        document.getElementById('admin-login-cancel').addEventListener('click', closeAdminLogin);
        adminPass.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryAdminLogin();
        });
        adminLoginModal.addEventListener('click', (e) => {
            if (e.target === adminLoginModal) closeAdminLogin();
        });
        adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) closeAdminPanel();
        });

        // Lock again and close
        document.getElementById('admin-lock').addEventListener('click', () => {
            adminUnlocked = false;
            closeAdminPanel();
        });

        // Add / Set jesuslings
        document.getElementById('admin-add').addEventListener('click', () => {
            const amount = parseAmount(adminAmount.value);
            if (amount === null) {
                setAdminStatus('Enter a number like 500, 5k or 2.5m.', 'err');
                return;
            }
            jesuslings = Math.min(jesuslings + amount, MAX_JESUSLINGS);
            saveGame();
            updateDisplay();
            setAdminStatus(`Added ${formatNumber(amount)} jesuslings.`, 'ok');
        });

        document.getElementById('admin-set').addEventListener('click', () => {
            const amount = parseAmount(adminAmount.value);
            if (amount === null) {
                setAdminStatus('Enter a number like 500, 5k or 2.5m.', 'err');
                return;
            }
            jesuslings = Math.min(amount, MAX_JESUSLINGS);
            saveGame();
            updateDisplay();
            setAdminStatus(`Jesuslings set to ${formatNumber(jesuslings)}.`, 'ok');
        });

        // Quick add buttons
        document.querySelectorAll('[data-quick]').forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = Number(btn.dataset.quick);
                jesuslings = Math.min(jesuslings + amount, MAX_JESUSLINGS);
                saveGame();
                updateDisplay();
                setAdminStatus(`Added ${formatNumber(amount)} jesuslings.`, 'ok');
            });
        });

        // Send Angry Jesus right now
        document.getElementById('admin-spawn-angry').addEventListener('click', () => {
            if (angryActive) {
                setAdminStatus('Angry Jesus is already on the screen.', 'err');
                return;
            }
            closeAdminPanel();
            spawnAngryJesus();
        });

        // Escape closes whichever window is open
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (modal.classList.contains('open')) closeModal();
            if (settingsModal.classList.contains('open')) closeSettings();
            if (adminLoginModal.classList.contains('open')) closeAdminLogin();
            if (adminModal.classList.contains('open')) closeAdminPanel();
        });

        // --- ANGRY JESUS EVENT ---

        let angryActive = false;
        let angryTimer = null;

        function floatText(message, x, y, kind) {
            const el = document.createElement('div');
            el.className = `float-text ${kind}`;
            el.innerText = message;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1700);
        }

        function spawnAngryJesus() {
            if (angryActive) return;
            angryActive = true;

            const el = document.createElement('div');
            el.className = 'angry-jesus';
            // random height, kept inside the visible screen
            const maxTop = Math.max(window.innerHeight - 180, 20);
            el.style.top = `${Math.floor(20 + Math.random() * maxTop)}px`;
            el.style.animationDuration = `${CROSS_TIME_SEC}s`;

            const img = document.createElement('img');
            img.alt = 'Angry Jesus';
            img.draggable = false;
            img.onerror = () => { img.onerror = null; img.src = ANGRY_FALLBACK; };
            img.src = ANGRY_IMG;
            el.appendChild(img);

            let resolved = false;

            // Popped him!
            el.addEventListener('click', (e) => {
                if (resolved) return;
                resolved = true;
                const reward = angryReward();
                jesuslings += reward;
                floatText(`+${formatNumber(reward)}`, e.clientX - 30, e.clientY - 20, 'gain');
                el.remove();
                saveGame();
                updateDisplay();
                finishEvent();
            });

            // He made it across the screen: lose 10%
            el.addEventListener('animationend', () => {
                if (resolved) return;
                resolved = true;
                const lost = Math.floor(jesuslings * PENALTY_PERCENT);
                jesuslings -= lost;
                floatText(`-${formatNumber(lost)}`, window.innerWidth - 200, el.getBoundingClientRect().top, 'loss');
                el.remove();
                saveGame();
                updateDisplay();
                finishEvent();
            });

            document.body.appendChild(el);
        }

        function finishEvent() {
            angryActive = false;
            scheduleAngryJesus();
        }

        // Only ever one timer waiting, so manual spawns can't stack up extra ones
        function scheduleAngryJesus() {
            clearTimeout(angryTimer);
            const wait = EVENT_MIN_MS + Math.random() * (EVENT_MAX_MS - EVENT_MIN_MS);
            angryTimer = setTimeout(spawnAngryJesus, wait);
        }

        scheduleAngryJesus();

        // Passive game loop
        setInterval(() => {
            if (perSecond() > 0) {
                jesuslings += perSecond();
                saveGame();
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
