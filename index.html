<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guzmaniclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f1f1f1;
            margin: 0;
            padding-top: 40px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 760px;
            max-width: 95%;
            height: 520px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
        }

        /* LEFT: clicking area */
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .jesuslings-title {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .jesuslings-number {
            font-size: 3rem;
            margin: 0 0 20px 0;
            color: #a0dce4;
            font-weight: bold;
        }

        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
            background: transparent;
        }

        .clicker-img {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15);
        }

        .image-clicker-container:active {
            transform: scale(0.92);
        }

        .reset-btn {
            margin-top: 25px;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }

        /* RIGHT: upgrades area, runs top to bottom */
        .upgrades-panel {
            width: 280px;
            background-color: #222;
            border-left: 1px solid #444;
            display: flex;
            flex-direction: column;
        }

        .upgrades-header {
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #444;
        }

        .upgrades-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-btn {
            width: 100%;
            padding: 12px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: left;
            transition: background-color 0.2s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #218838;
        }

        .upgrade-btn:disabled {
            background-color: #444;
            color: #999;
            cursor: not-allowed;
        }

        .upgrade-name {
            display: block;
            font-size: 15px;
            font-weight: bold;
        }

        .upgrade-info {
            display: block;
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- LEFT: clicking area -->
        <div class="left-panel">
            <div class="jesuslings-title">jesuslings</div>
            <div class="jesuslings-number" id="jesuslings">0</div>

            <div id="click-target" class="image-clicker-container">
                <img src="ppzeus.png" alt="Click Target" class="clicker-img">
            </div>

            <button class="reset-btn" onclick="resetGame()">Reset Game Data</button>
        </div>

        <!-- RIGHT: upgrades, top to bottom -->
        <div class="upgrades-panel">
            <div class="upgrades-header">Upgrades</div>
            <div class="upgrades-list">

                <button id="upgrade-btn" class="upgrade-btn" disabled>
                    <span class="upgrade-name" id="auto-name">Auto-Clicker</span>
                    <span class="upgrade-info" id="auto-info"></span>
                </button>

                <button id="power-btn" class="upgrade-btn" disabled>
                    <span class="upgrade-name" id="power-name">Click Power</span>
                    <span class="upgrade-info" id="power-info"></span>
                </button>

                <!-- Add more upgrade buttons here -->
            </div>
        </div>

    </div>

    <script>
        // --- GAME STATE ---
        let jesuslings = parseInt(localStorage.getItem('clicker_jesuslings')) || 0;
        let autoClickers = parseInt(localStorage.getItem('clicker_autos')) || 0;
        let upgradeCost = parseInt(localStorage.getItem('clicker_cost')) || 10;
        let clickPower = parseInt(localStorage.getItem('clicker_power')) || 1;
        let powerCost = parseInt(localStorage.getItem('clicker_power_cost')) || 50;

        // --- DOM ELEMENTS ---
        const jesuslingsDisplay = document.getElementById('jesuslings');
        const clickTarget = document.getElementById('click-target');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const powerBtn = document.getElementById('power-btn');
        const autoName = document.getElementById('auto-name');
        const autoInfo = document.getElementById('auto-info');
        const powerName = document.getElementById('power-name');
        const powerInfo = document.getElementById('power-info');

        updateDisplay();

        // --- CORE LOGIC ---

        clickTarget.addEventListener('click', () => {
            jesuslings += clickPower;
            saveGame();
            updateDisplay();
        });

        upgradeBtn.addEventListener('click', () => {
            if (jesuslings >= upgradeCost) {
                jesuslings -= upgradeCost;
                autoClickers++;
                upgradeCost = Math.round(upgradeCost * 1.5);
                saveGame();
                updateDisplay();
            }
        });

        powerBtn.addEventListener('click', () => {
            if (jesuslings >= powerCost) {
                jesuslings -= powerCost;
                clickPower++;
                powerCost = Math.round(powerCost * 2);
                saveGame();
                updateDisplay();
            }
        });

        function updateDisplay() {
            jesuslingsDisplay.innerText = jesuslings;

            autoName.innerText = `Auto-Clicker (Owned: ${autoClickers})`;
            autoInfo.innerText = `Cost: ${upgradeCost}`;
            upgradeBtn.disabled = jesuslings < upgradeCost;

            powerName.innerText = `Click Power (Level: ${clickPower})`;
            powerInfo.innerText = `Cost: ${powerCost}`;
            powerBtn.disabled = jesuslings < powerCost;
        }

        function saveGame() {
            localStorage.setItem('clicker_jesuslings', jesuslings);
            localStorage.setItem('clicker_autos', autoClickers);
            localStorage.setItem('clicker_cost', upgradeCost);
            localStorage.setItem('clicker_power', clickPower);
            localStorage.setItem('clicker_power_cost', powerCost);
        }

        function resetGame() {
            if (confirm("Are you sure you want to reset your jesuslings?")) {
                localStorage.clear();
                jesuslings = 0;
                autoClickers = 0;
                upgradeCost = 10;
                clickPower = 1;
                powerCost = 50;
                updateDisplay();
            }
        }

        // Passive game loop
        setInterval(() => {
            if (autoClickers > 0) {
                jesuslings += autoClickers;
                saveGame();
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
