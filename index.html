<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guzmaniclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding-top: 50px;
        }

        .game-container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        /* Pure Image Clicker (No background box) */
        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
            margin: 20px 0;
            background: transparent; /* Ensures no background box reveals */
        }

        .clicker-img {
            max-width: 200px;
            max-height: 200px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15); /* Brighten image slightly on hover */
        }

        .image-clicker-container:active {
            transform: scale(0.92); /* Shrink the image slightly when clicked */
        }

        /* Shop Upgrade Button */
        .upgrade-btn {
            margin-top: 30px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .upgrade-btn:hover {
            background-color: #218838;
        }

        .upgrade-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        
        .reset-btn {
            margin-top: 20px;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>jesuslings: <span id="jesuslings">0</span></h1>
        
        <!-- Main Transparent Image Clicker Target -->
        <div id="click-target" class="image-clicker-container">
            <img src="ppzeus.png" alt="Click Target" class="clicker-img">
        </div>
        
        <br>
        
        <!-- Auto Clicker Upgrade -->
        <button id="upgrade-btn" class="upgrade-btn" disabled>
            Buy Auto-Clicker (Cost: 10)
        </button>
        
        <div class="stats">
            Auto-Clickers Owned: <span id="auto-count">0</span>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game Data</button>
    </div>

    <script>
        // --- GAME STATE ---
        let jesuslings = parseInt(localStorage.getItem('clicker_jesuslings')) || 0;
        let autoClickers = parseInt(localStorage.getItem('clicker_autos')) || 0;
        let upgradeCost = parseInt(localStorage.getItem('clicker_cost')) || 10;

        // --- DOM ELEMENTS ---
        const jesuslingsDisplay = document.getElementById('jesuslings');
        const clickTarget = document.getElementById('click-target');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const autoCountDisplay = document.getElementById('auto-count');

        // Initial setup on load
        updateDisplay();

        // --- CORE LOGIC ---

        // 1. Image Click
        clickTarget.addEventListener('click', () => {
            jesuslings++;
            saveGame();
            updateDisplay();
        });

        // 2. Buy Auto-Clicker Upgrade
        upgradeBtn.addEventListener('click', () => {
            if (jesuslings >= upgradeCost) {
                jesuslings -= upgradeCost;
                autoClickers++;
                
                upgradeCost = Math.round(upgradeCost * 1.5); 
                
                saveGame();
                updateDisplay();
            }
        });

        // 3. Keep visual elements synchronized
        function updateDisplay() {
            jesuslingsDisplay.innerText = jesuslings;
            autoCountDisplay.innerText = autoClickers;
            upgradeBtn.innerText = `Buy Auto-Clicker (Cost: ${upgradeCost})`;
            
            if (jesuslings >= upgradeCost) {
                upgradeBtn.disabled = false;
            } else {
                upgradeBtn.disabled = true;
            }
        }

        // 4. Save game parameters to local storage
        function saveGame() {
            localStorage.setItem('clicker_jesuslings', jesuslings);
            localStorage.setItem('clicker_autos', autoClickers);
            localStorage.setItem('clicker_cost', upgradeCost);
        }

        // 5. Hard data reset
        function resetGame() {
            if (confirm("Are you sure you want to reset your jesuslings?")) {
                localStorage.clear();
                jesuslings = 0;
                autoClickers = 0;
                upgradeCost = 10;
                updateDisplay();
            }
        }

        // 6. Passive Game Loop
        setInterval(() => {
            if (autoClickers > 0) {
                jesuslings += autoClickers;
                saveGame();
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
