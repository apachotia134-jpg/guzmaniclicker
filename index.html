<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guzmaniclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f1f1f1;
            margin: 0;
            padding-top: 40px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 760px;
            max-width: 95%;
            height: 560px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .jesuslings-title {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .jesuslings-number {
            font-size: 3rem;
            margin: 0 0 20px 0;
            color: #a0dce4;
            font-weight: bold;
        }

        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
            background: transparent;
        }

        .clicker-img {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15);
        }

        .image-clicker-container:active {
            transform: scale(0.92);
        }

        .reset-btn {
            margin-top: 25px;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }

        /* RIGHT: upgrades column */
        .upgrades-panel {
            width: 290px;
            background-color: #222;
            border-left: 1px solid #444;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Each section is its own box */
        .upgrade-box {
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            padding: 10px;
        }

        .upgrade-box-title {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .upgrade-box-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-btn {
            width: 100%;
            padding: 10px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s;
        }

        .upgrade-btn:hover:not(:disabled) {
            background-color: #218838;
        }

        .upgrade-btn:disabled {
            background-color: #444;
            color: #999;
            cursor: not-allowed;
        }

        .upgrade-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            object-fit: contain;
            border-radius: 4px;
            background: rgba(0,0,0,0.25);
        }

        .upgrade-btn:disabled .upgrade-icon {
            filter: grayscale(1);
            opacity: 0.6;
        }

        .upgrade-text {
            display: block;
        }

        .upgrade-name {
            display: block;
            font-size: 15px;
            font-weight: bold;
        }

        .upgrade-info {
            display: block;
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="left-panel">
            <div class="jesuslings-title">jesuslings</div>
            <div class="jesuslings-number" id="jesuslings">0</div>

            <div id="click-target" class="image-clicker-container">
                <img src="ppzeus.png" alt="Click Target" class="clicker-img">
            </div>

            <button class="reset-btn" onclick="resetGame()">Reset Game Data</button>
        </div>

        <div class="upgrades-panel">

            <!-- Click upgrades box (top) -->
            <div class="upgrade-box">
                <div class="upgrade-box-title">Click Upgrades</div>
                <div class="upgrade-box-list" id="click-upgrades"></div>
            </div>

            <!-- Other upgrades box (below) -->
            <div class="upgrade-box">
                <div class="upgrade-box-title">Other Upgrades</div>
                <div class="upgrade-box-list" id="other-upgrades"></div>
            </div>

        </div>
    </div>

    <script>
        // --- PLACEHOLDER ICON (shown when your image file isn't found) ---
        const FALLBACK_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
            '<rect width="64" height="64" rx="8" fill="#555"/>' +
            '<text x="32" y="42" font-size="30" text-anchor="middle" fill="#ddd" font-family="Arial">?</text>' +
            '</svg>'
        );

        function useFallbackIcon(img) {
            img.onerror = null; // prevent an endless error loop
            img.src = FALLBACK_ICON;
        }

        // --- UPGRADE LIST ---
        // section: 'click' = top box, 'other' = bottom box
        // growth: how much the cost multiplies after each purchase
        const UPGRADES = [
            {
                id: 'power', section: 'click',
                name: 'jesus impact', img: 'powerman.png',
                levelLabel: 'Level', desc: '+1 per click',
                baseCost: 50, growth: 2, startLevel: 1,
                levelKey: 'clicker_power', costKey: 'clicker_power_cost'
            },
            {
                id: 'blessing', section: 'click',
                name: 'jesus blessing', img: 'atruesaint.png',
                levelLabel: 'Level', desc: 'x2 click value',
                baseCost: 500, growth: 3, startLevel: 0,
                levelKey: 'clicker_blessing', costKey: 'clicker_blessing_cost'
            },
            {
                id: 'auto', section: 'other',
                name: 'jesus slaves', img: 'jesusslaves.png',
                levelLabel: 'Owned', desc: '+1 per second each',
                baseCost: 10, growth: 1.5, startLevel: 0,
                levelKey: 'clicker_autos', costKey: 'clicker_cost'
            }
        ];

        // --- GAME STATE ---
        let jesuslings = parseInt(localStorage.getItem('clicker_jesuslings')) || 0;

        UPGRADES.forEach(u => {
            const savedLevel = localStorage.getItem(u.levelKey);
            const savedCost = localStorage.getItem(u.costKey);
            u.level = savedLevel !== null ? parseInt(savedLevel) : u.startLevel;
            u.cost = savedCost !== null ? parseInt(savedCost) : u.baseCost;
        });

        function getUpgrade(id) {
            return UPGRADES.find(u => u.id === id);
        }

        // Jesuslings gained per click
        function clickValue() {
            return getUpgrade('power').level * Math.pow(2, getUpgrade('blessing').level);
        }

        // Jesuslings gained per second
        function perSecond() {
            return getUpgrade('auto').level;
        }

        // --- BUILD THE UPGRADE BUTTONS ---
        const clickTarget = document.getElementById('click-target');
        const jesuslingsDisplay = document.getElementById('jesuslings');

        UPGRADES.forEach(u => {
            const btn = document.createElement('button');
            btn.className = 'upgrade-btn';
            btn.disabled = true;

            const img = document.createElement('img');
            img.className = 'upgrade-icon';
            img.alt = '';
            img.onerror = () => useFallbackIcon(img);
            img.src = u.img;

            const text = document.createElement('span');
            text.className = 'upgrade-text';

            u.nameEl = document.createElement('span');
            u.nameEl.className = 'upgrade-name';
            u.infoEl = document.createElement('span');
            u.infoEl.className = 'upgrade-info';

            text.appendChild(u.nameEl);
            text.appendChild(u.infoEl);
            btn.appendChild(img);
            btn.appendChild(text);

            btn.addEventListener('click', () => buyUpgrade(u));
            u.btn = btn;

            const container = document.getElementById(u.section === 'click' ? 'click-upgrades' : 'other-upgrades');
            container.appendChild(btn);
        });

        updateDisplay();

        // --- CORE LOGIC ---

        clickTarget.addEventListener('click', () => {
            jesuslings += clickValue();
            saveGame();
            updateDisplay();
        });

        function buyUpgrade(u) {
            if (jesuslings >= u.cost) {
                jesuslings -= u.cost;
                u.level++;
                u.cost = Math.round(u.cost * u.growth);
                saveGame();
                updateDisplay();
            }
        }

        function updateDisplay() {
            jesuslingsDisplay.innerText = jesuslings;

            UPGRADES.forEach(u => {
                u.nameEl.innerText = `${u.name} (${u.levelLabel}: ${u.level})`;
                u.infoEl.innerText = `${u.desc} | Cost: ${u.cost}`;
                u.btn.disabled = jesuslings < u.cost;
            });
        }

        function saveGame() {
            localStorage.setItem('clicker_jesuslings', jesuslings);
            UPGRADES.forEach(u => {
                localStorage.setItem(u.levelKey, u.level);
                localStorage.setItem(u.costKey, u.cost);
            });
        }

        function resetGame() {
            if (confirm("Are you sure you want to reset your jesuslings?")) {
                localStorage.clear();
                jesuslings = 0;
                UPGRADES.forEach(u => {
                    u.level = u.startLevel;
                    u.cost = u.baseCost;
                });
                updateDisplay();
            }
        }

        // Passive game loop
        setInterval(() => {
            if (perSecond() > 0) {
                jesuslings += perSecond();
                saveGame();
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
