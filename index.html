<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guzmaniclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f1f1f1;
            margin: 0;
            padding-top: 40px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 760px;
            max-width: 95%;
            height: 560px;
            background-color: #2a2a2a;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            position: relative; /* lets the corner label sit inside this panel */
        }

        /* Small "per click" number in the corner */
        .per-click {
            position: absolute;
            top: 12px;
            left: 14px;
            font-size: 13px;
            color: #a0dce4;
            opacity: 0.9;
        }

        .jesuslings-title {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .jesuslings-number {
            font-size: 3rem;
            margin: 0 0 20px 0;
            color: #a0dce4;
            font-weight: bold;
        }

        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
            background: transparent;
        }

        .clicker-img {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15);
        }

        .image-clicker-container:active {
            transform: scale(0.92);
        }

        .reset-btn {
            margin-top: 25px;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }

        /* RIGHT: upgrades column */
        .upgrades-panel {
            width: 290px;
            background-color: #222;
            border-left: 1px solid #444;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Each section is its own box */
        .upgrade-box {
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #2a2a2a;
            padding: 10px;
