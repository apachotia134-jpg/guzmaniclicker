<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guzmaniclicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #f1f1f1;
            padding-top: 50px;
            display: flex;
            justify-content: center;
        }

        /* Widened container to hold side-by-side elements nicely */
        .game-container {
            width: 600px;
            max-width: 90%;
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        /* Left Side: Clicker Area */
        .left-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Right Side: Stats and Upgrades */
        .right-panel {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Split-level jesuslings layout */
        .jesuslings-title {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        .jesuslings-number {
            font-size: 3rem;
            margin: 0 0 20px 0;
            color: #a0dce4;
            font-weight: bold;
        }

        /* Pure Image Clicker (No background box) */
        .image-clicker-container {
            display: inline-block;
            cursor: pointer;
            user-select: none;
            outline: none;
            transition: transform 0.1s;
            background: transparent;
        }

        .clicker-img {
            max-width: 220px;
            max-height: 220px;
            width: auto;
            height: auto;
            object-fit: contain;
            transition: filter 0.2s;
        }

        .image-clicker-container:hover .clicker-img {
            filter: brightness(1.15);
        }

        .image-clicker-container:active {
            transform: scale(0.92);
        }

        /* Shop Upgrade Button */
        .upgrade-btn {
            width: 100%;
            max-width: 220px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .upgrade-btn:hover {
            background-color: #218838;
        }

        .upgrade-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        .stats {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }
        
        .reset-btn {
            margin-top: 25px;
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            text-decoration: underline;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- LEFT PANEL: Image Clicker Area -->
        <div class="left-panel">
            <div id="click-target" class="image-clicker-container">
                <img src="ppzeus.png" alt="Click Target" class="clicker-img">
            </div>
        </div>
        
        <!-- RIGHT PANEL: jesuslings, Stats, and Upgrades -->
        <div class="right-panel">
            <div class="jesuslings-title">jesuslings</div>
            <div class="jesuslings-number" id="jesuslings">0</div>
            
            <!-- Auto Clicker Upgrade -->
            <button id="upgrade-btn" class="upgrade-btn" disabled>
                Buy Auto-Clicker (Cost: 10)
            </button>
            
            <div class="stats">
                Auto-Clickers Owned: <span id="auto-count">0</span>
            </div>

            <button class="reset-btn" onclick="resetGame()">Reset Game Data</button>
        </div>

    </div>

    <script>
        // --- GAME STATE ---
        let jesuslings = parseInt(localStorage.getItem('clicker_jesuslings')) || 0;
        let autoClickers = parseInt(localStorage.getItem('clicker_autos')) || 0;
        let upgradeCost = parseInt(localStorage.getItem('clicker_cost')) || 10;

        // --- DOM ELEMENTS ---
        const jesuslingsDisplay = document.getElementById('jesuslings');
        const clickTarget = document.getElementById('click-target');
        const upgradeBtn = document.getElementById('upgrade-btn');
        const autoCountDisplay = document.getElementById('auto-count');

        // Initial setup on load
        updateDisplay();

        // --- CORE LOGIC ---

        // 1. Image Click
        clickTarget.addEventListener('click', () => {
            jesuslings++;
            saveGame();
            updateDisplay();
        });

        // 2. Buy Auto-Clicker Upgrade
        upgradeBtn.addEventListener('click', () => {
            if (jesuslings >= upgradeCost) {
                jesuslings -= upgradeCost;
                autoClickers++;
                
                upgradeCost = Math.round(upgradeCost * 1.5); 
                
                saveGame();
                updateDisplay();
            }
        });

        // 3. Keep visual elements synchronized
        function updateDisplay() {
            jesuslingsDisplay.innerText = jesuslings;
            autoCountDisplay.innerText = autoClickers;
            upgradeBtn.innerText = `Buy Auto-Clicker (Cost: ${upgradeCost})`;
            
            if (jesuslings >= upgradeCost) {
                upgradeBtn.disabled = false;
            } else {
                upgradeBtn.disabled = true;
            }
        }

        // 4. Save game parameters to local storage
        function saveGame() {
            localStorage.setItem('clicker_jesuslings', jesuslings);
            localStorage.setItem('clicker_autos', autoClickers);
            localStorage.setItem('clicker_cost', upgradeCost);
        }

        // 5. Hard data reset
        function resetGame() {
            if (confirm("Are you sure you want to reset your jesuslings?")) {
                localStorage.clear();
                jesuslings = 0;
                autoClickers = 0;
                upgradeCost = 10;
                updateDisplay();
            }
        }

        // 6. Passive Game Loop
        setInterval(() => {
            if (autoClickers > 0) {
                jesuslings += autoClickers;
                saveGame();
                updateDisplay();
            }
        }, 1000);
    </script>

</body>
</html>
